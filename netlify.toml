[build]
  publish = "."
  command = "echo 'No build step required for static site'"

[build.environment]
  NODE_VERSION = "20"

# frame-src must allow YouTube lesson embeds and the Netlify Identity login frame.
# Other resource types stay unrestricted so the content manager and fonts keep working.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "frame-src 'self' https://www.youtube.com https://youtube.com https://www.youtube-nocookie.com https://youtube-nocookie.com https://identity.netlify.com;"

[[redirects]]
  from = "/home"
  to = "/"
  status = 301

[[redirects]]
  from = "/content"
  to = "/"
  status = 200

[[redirects]]
  from = "/about"
  to = "/"
  status = 200

[[redirects]]
  from = "/licensing"
  to = "/"
  status = 200

[[redirects]]
  from = "/subscribe"
  to = "/"
  status = 200

[[redirects]]
  from = "/explainers"
  to = "/"
  status = 200

# Curriculum index is a section of the home page, like the other routes.
# /curriculum/session-3/ is a real file and must not be rewritten here.
[[redirects]]
  from = "/curriculum/session-3"
  to = "/curriculum/session-3/"
  status = 301

# force: the session files live under /curriculum/, so the directory must not
# shadow this rewrite. Exact paths only; /curriculum/session-3/ is a real page.
[[redirects]]
  from = "/curriculum"
  to = "/"
  status = 200
  force = true

[[redirects]]
  from = "/curriculum/"
  to = "/"
  status = 200
  force = true

[[redirects]]
  from = "/apologetics"
  to = "/"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200
